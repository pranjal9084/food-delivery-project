<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Employee Table</title>
  
</head>
<body>

  <table border="3">
    <tr >
      <th>Sr No</th>
      <th>Name</th>
      <th>Salary</th>
      <th>Type</th>
    </tr>
    
    <tr>
      <td>1</td>
      <td>X</td>
      <td>₹50</td>
      <td rowspan="3">C</td>
    </tr>
    <tr>
      <td>2</td>
      <td>Y</td>
      <td>₹4000</td>
      
    </tr>
    <tr>
      <td>3</td>
      <td>Z</td>
      <td>₹600</td>
      
    </tr>
    <tr>
        <td colspan="2">Total expense</td>
        <td>₹4650</td>
    </tr>
  </table>

</body>
</html>
